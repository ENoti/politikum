name: Deploy production

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    environment: production
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release before installing files
        uses: ./.github/actions/verify

      - name: Install backend
        run: |
          mkdir -p /opt/politikum/politikum-main-backend/target
          cp politikum-main-backend/target/backend.jar /opt/politikum/politikum-main-backend/target/backend.jar

      - name: Install frontend
        run: |
          mkdir -p /opt/politikum/politikum-main-frontend/dist
          rsync -a --delete politikum-main-frontend/dist/ /opt/politikum/politikum-main-frontend/dist/

      - name: Restart services
        run: |
          sudo systemctl restart politikum-backend
          sudo systemctl reload nginx

      - name: Verify services
        run: |
          systemctl is-active politikum-backend
          systemctl is-active nginx

      - name: Wait for Java API and nginx routes
        env:
          PROBE_HOST: 109.107.167.179
        run: node scripts/check-http.mjs http://127.0.0.1:8081 http://127.0.0.1

      - name: Save test failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-test-failures
          path: |
            politikum-main-backend/target/surefire-reports/
            politikum-main-frontend/test-results/
          retention-days: 7
