name: CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'hotfix/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/verify
      - name: Save test failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-failures
          path: |
            politikum-main-backend/target/surefire-reports/
            politikum-main-frontend/test-results/
          retention-days: 7
